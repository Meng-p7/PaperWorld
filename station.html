<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>空间站 · PaperWorld 四幕科研故事</title>
<meta name="description" content="走进 PaperWorld 空间站，在四个故事区域之间选择：难题、解法、结果、价值与局限。">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/cosmos.css">
<link rel="stylesheet" href="css/refined.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23040711'/><path d='M8 22V10l8 7 8-7v12' stroke='%238ce8ff' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body class="cosmos-page">

<div class="cosmos-loader is-run" id="loader">
  <div class="cosmos-loader__in">
    <div class="ldr-paper" aria-hidden="true">
      <div class="ldr-half l">
        <i class="ldr-pg"><b class="ldr-ttl"></b><b class="ldr-sub"></b><b class="ldr-lines"></b><b class="ldr-fig"></b></i>
      </div>
      <div class="ldr-half r">
        <i class="ldr-pg"><b class="ldr-ttl"></b><b class="ldr-sub"></b><b class="ldr-lines"></b><b class="ldr-fig"></b></i>
      </div>
    </div>
    <div class="ldr-crease" aria-hidden="true"></div>
    <div class="ldr-word" id="loader-word">PaperWorld</div>
    <div class="ldr-beam" aria-hidden="true"></div>
    <p class="ldr-meta" id="loader-text">正在进入空间站</p>
  </div>
</div>

<canvas id="sky" class="cosmos__layer" aria-hidden="true"></canvas>
<canvas id="particles" class="cosmos__layer cosmos__particles" aria-hidden="true"></canvas>
<div class="cosmos__vignette" aria-hidden="true"></div>

<header class="cosmos-topbar">
  <a class="brand" href="index.html"><b>PaperWorld</b><span class="brand__sub">科研博物馆</span></a>
  <nav class="cosmos-nav">
    <a href="station.html" class="is-active">探索</a>
    <a href="parse.html">上传论文</a>
    <a href="core.html">设置</a>
    <button id="nav-toggle" class="iconbtn nav-toggle" aria-label="打开导航" aria-expanded="false" aria-controls="mobile-menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </nav>
  <div id="mobile-menu" class="mobile-menu" aria-label="移动端导航">
    <a href="station.html">探索</a>
    <a href="parse.html">上传论文</a>
    <a href="core.html">设置</a>
  </div>
</header>

<main class="station" id="station">
  <div class="station__head">
    <div class="station__intro">
      <p class="station__eyebrow">四幕科研故事</p>
      <h1 class="station__title" id="station-title">四幕，读懂这篇论文</h1>
      <p class="station__paper" id="station-paper"></p>
      <p class="station__meta" id="station-meta"></p>
    </div>
    <div class="station__tools">
      <button class="cbtn cbtn--ghost cbtn--sm" id="back">返回首页</button>
      <span class="station__backend" id="backend"></span>
    </div>
  </div>

  <div class="station-canvas-wrap" id="station3d">
    <canvas id="station-canvas"></canvas>
    <div class="station-plates"></div>
    <div class="station-hint">拖动转头 · 对准舱门后点击进入 · 滚轮前后移动</div>
    <div class="station-hint station-hint--m">左右滑动转头 · 点舱门进入</div>
  </div>

  <div class="station__map" id="map">
    <div class="station__floor" aria-hidden="true"></div>
    <div class="station__corridor" id="corridor"></div>
  </div>

  <div class="station__legend">
    <span>四个舱门对应故事的四幕</span>
    <span>想跳过着色与动画，可直接阅读</span>
    <span>结论均可回到论文原页</span>
  </div>
</main>

<div class="warp-flash" id="flash" aria-hidden="true"></div>

<script type="module" src="js/cosmos/station.js"></script>
<script src="js/fileguard.js"></script>
</body>
</html>
