<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>论文展览 · PaperWorld</title>
<meta name="description" content="一篇论文的完整展览：四幕故事讲清楚为什么研究、怎么做、效果如何、价值与局限，四幕之后是可以逐页核对的完整档案。">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/exhibition.css">
<link rel="stylesheet" href="css/studio.css">
<link rel="stylesheet" href="css/cosmos.css">
<link rel="stylesheet" href="css/story.css">
<link rel="stylesheet" href="css/refined.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2306080b'/><path d='M8 22V10l8 7 8-7v12' stroke='%23f2b45c' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body class="hall-page story-page">

<header class="topbar">
  <a class="brand" href="index.html"><b>PaperWorld</b><span class="brand__sub">科研博物馆</span></a>
  <nav class="topnav">
    <a href="station.html">探索</a>
    <a href="parse.html">上传论文</a>
    <a href="core.html">设置</a>
    <button id="nav-toggle" class="iconbtn nav-toggle" aria-label="打开导航" aria-expanded="false" aria-controls="mobile-menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </nav>
  <div id="mobile-menu" class="mobile-menu" aria-label="移动端导航">
    <a href="station.html">探索</a>
    <a href="parse.html">上传论文</a>
    <a href="core.html">设置</a>
  </div>
</header>

<main class="story-wrap">
  <section class="story-hero">
    <div class="cosmos-kicker">四幕科研故事 · 约 2 分钟</div>
    <h1 class="story-hero__title" id="story-title">正在载入…</h1>
    <p class="story-hero__sub" id="story-sub"></p>
    <div class="story-hero__meta" id="story-meta"></div>
    <p class="story-hero__note" id="story-note"></p>

    <nav class="act-nav" id="act-nav" aria-label="四幕导航"></nav>

    <div class="story-hero__actions">
      <a class="text-link" id="enter-station" href="station.html">← 回空间站</a>
      <a class="text-link" id="enter-parse" href="parse.html">讲我的论文</a>
    </div>
  </section>

  <div id="story" class="story"></div>

  <section class="archive" id="full-archive" aria-labelledby="archive-title">
    <header class="archive__head">
      <p class="archive__eyebrow">完整档案</p>
      <h2 class="archive__title" id="archive-title">这篇论文的全部资料</h2>
      <p class="archive__lead">
        原始分厅、全部图表与实验数据、参考文献，以及可以逐页核对的原文。
        四幕读完之后再来这里看细节。
      </p>
      <nav class="archive__jump" id="holo-links" aria-label="档案主题跳转"></nav>
    </header>
    <main id="halls"></main>
    <div id="story-refs" class="story-refs"></div>
  </section>

  <section class="story-foot">
    <p>
      通俗解读与技术细节是策展语，不是论文原文；每一幕的结论由原文依据承担，点页码即可回到 PDF 原页核对。
    </p>
  </section>
</main>

<div id="scrim" class="scrim"></div>
<aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-label="原文证据">
  <div class="drawer__head">
    <span id="drawer-title" class="tag" style="letter-spacing:.16em">证据</span>
    <button class="iconbtn" aria-label="关闭" onclick="document.getElementById('scrim').click()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div id="drawer-body" class="drawer__body"></div>
</aside>

<script type="module" src="js/engine/story.js"></script>
<script src="js/fileguard.js"></script>
</body>
</html>
