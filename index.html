<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperWorld · 把论文变成可以走进去的科研故事</title>
<meta name="description" content="PaperWorld 用四幕故事和一处可以走进去的空间站，让人在几分钟内读懂一篇论文。每条结论都能回到论文原页。">
<script>
  // 旧分享链接 index.html?e=<id> 继续可用，现在统一进入四幕主线。
  (function () {
    var q = new URLSearchParams(location.search);
    if (q.has("e")) location.replace("story.html" + location.search + location.hash);
  })();
</script>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/cosmos.css">
<link rel="stylesheet" href="css/refined.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23040711'/><path d='M8 22V10l8 7 8-7v12' stroke='%238ce8ff' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body class="cosmos-page home-page">

<div class="cosmos-loader" id="loader">
  <div class="cosmos-loader__in">
    <div class="cosmos-loader__mark">PaperWorld</div>
    <div class="cosmos-loader__track"><i></i></div>
    <div class="cosmos-loader__t" id="loader-text">正在接近空间站</div>
  </div>
</div>

<canvas id="sky" class="cosmos__layer" aria-hidden="true"></canvas>
<canvas id="particles" class="cosmos__layer cosmos__particles" aria-hidden="true"></canvas>
<canvas id="entrance-canvas" class="entrance-scene" aria-hidden="true"></canvas>
<div class="entrance-scrim" aria-hidden="true"></div>

<header class="cosmos-topbar">
  <a class="brand" href="index.html"><b>PaperWorld</b><span class="brand__sub">科研博物馆</span></a>
  <nav class="cosmos-nav">
    <a href="index.html" class="is-active">首页</a>
    <a href="station.html">空间站</a>
    <a href="story.html">科研故事</a>
    <a href="parse.html">上传论文</a>
    <a href="core.html">AI Core</a>
    <a href="about.html">关于</a>
    <button id="skip" class="cosmos-nav__go">跳过动画</button>
    <button id="nav-toggle" class="iconbtn nav-toggle" aria-label="打开导航" aria-expanded="false" aria-controls="mobile-menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </nav>
  <div id="mobile-menu" class="mobile-menu" aria-label="移动端导航">
    <a href="index.html">首页</a>
    <a href="station.html">空间站</a>
    <a href="story.html">科研故事</a>
    <a href="parse.html">上传论文</a>
    <a href="core.html">AI Core</a>
    <a href="about.html">关于</a>
  </div>
</header>

<main class="entrance">
  <div class="entrance__body" id="hero">
    <p class="entrance__eyebrow">AI 数字科研博物馆</p>
    <h1 class="entrance__title">把论文，<br>送到<em>眼前</em></h1>
    <p class="entrance__sub">
      用四幕故事读懂一篇论文：为什么研究、怎么做到、效果如何、还留下什么。
      每条结论都能回到原文那一页。
    </p>
    <div class="entrance__actions">
      <button class="cbtn cbtn--primary" id="launch">进入空间站</button>
      <a class="cbtn cbtn--ghost" href="parse.html">上传我的论文</a>
    </div>
    <p class="entrance__first" id="first-story">
      首展 ALOHA / ACT · 四幕约 2 分钟 · 81 条可核验证据
      <a href="story.html">直接阅读 →</a>
    </p>
  </div>

  <div class="entrance__foot">
    <div class="camstage" aria-label="镜头阶段">
      <span class="camstage__i is-on" data-stage="CRUISE">01 远景</span>
      <span class="camstage__i" data-stage="WARP">02 接近</span>
      <span class="camstage__i" data-stage="DOCK">03 对接</span>
      <div class="camstage__bar"><i id="cam-bar"></i></div>
    </div>
    <div class="entrance__hint">滚动或点击「进入空间站」推进镜头 · 随时可跳过</div>
  </div>
</main>

<div class="warp-flash" id="flash" aria-hidden="true"></div>

<script type="module" src="js/cosmos/entrance.js"></script>
</body>
</html>
